<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoundVerse - Uzay Temalı Müzik Deneyimi</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
    background: #090a0f;
    color: #ffffff;
    height: 100vh;
    display: grid;
    grid-template-columns: 240px 1fr;
    grid-template-rows: 1fr 90px;
    grid-template-areas: 
        "sidebar main"
        "player player";
    overflow: hidden;
    position: relative;
}

/* YILDIZ ARKA PLAN EFEKTİ */
body::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background-image: radial-gradient(white 1px, transparent 0);
    background-size: 50px 50px;
    opacity: 0.15;
    z-index: -1;
    pointer-events: none;
}

/* GİRİŞ FORMU MODALI */
.auth-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(5, 6, 10, 0.95);
    backdrop-filter: blur(15px);
    z-index: 2000;
    display: flex;
    align-items: center;
    justify-content: center;
}

.auth-box {
    background: linear-gradient(135deg, #131525 0%, #0b0d17 100%);
    border: 1px solid #2a2d4a;
    width: 420px;
    padding: 35px 30px;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(168, 85, 247, 0.3);
}

.auth-box h1 {
    font-size: 26px;
    color: #a855f7;
    margin-bottom: 8px;
}

.auth-box p {
    font-size: 14px;
    color: #94a3b8;
    margin-bottom: 20px;
}

.form-group {
    text-align: left;
    margin-bottom: 14px;
}

.form-group label {
    display: block;
    font-size: 12px;
    color: #a855f7;
    margin-bottom: 6px;
    font-weight: 600;
}

.auth-input {
    width: 100%;
    padding: 12px 14px;
    background: #1e213a;
    border: 1px solid #3b4267;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    outline: none;
}
.auth-input:focus { border-color: #a855f7; }

.auth-btn {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
    border: none;
    border-radius: 8px;
    color: white;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    transition: opacity 0.2s;
}
.auth-btn:hover { opacity: 0.9; }

/* SIDEBAR */
.sidebar {
    grid-area: sidebar;
    background: #05060a;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    border-right: 1px solid #1e213a;
}

.logo {
    font-size: 22px;
    font-weight: 800;
    color: #a855f7;
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: -0.5px;
    text-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
}

.menu-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.menu-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 12px;
    border-radius: 6px;
    color: #94a3b8;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
}

.menu-item:hover, .menu-item.active {
    color: #ffffff;
    background: #1e213a;
}

.playlist-divider {
    height: 1px;
    background: #1e213a;
    margin: 8px 0;
}

.playlist-list {
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: calc(100vh - 350px);
}

.playlist-item {
    font-size: 13px;
    color: #94a3b8;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.playlist-item:hover { color: #ffffff; background: #161828; }

/* MAIN CONTENT */
.main {
    grid-area: main;
    background: linear-gradient(180deg, #16122d 0%, #090a0f 300px);
    overflow-y: auto;
    padding: 24px 32px;
    position: relative;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
}

.search-box {
    display: flex;
    align-items: center;
    background: #161828;
    border-radius: 500px;
    padding: 10px 16px;
    width: 360px;
    gap: 10px;
    border: 1px solid #2a2d4a;
}
.search-box:focus-within { border-color: #a855f7; background: #1b1e36; }
.search-box input {
    background: none;
    border: none;
    color: #fff;
    outline: none;
    font-size: 14px;
    width: 100%;
}

.user-profile {
    width: 38px;
    height: 38px;
    background: linear-gradient(135deg, #a855f7, #6366f1);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
}

/* SECTIONS */
.section-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 16px;
    letter-spacing: -0.4px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 20px;
    margin-bottom: 36px;
}

.card {
    background: #131525;
    border: 1px solid #1e213a;
    padding: 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    display: flex;
    flex-direction: column;
}
.card:hover { background: #1c2038; border-color: #a855f7; transform: translateY(-3px); }

.card-img-container {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 6px;
    overflow: hidden;
    position: relative;
    margin-bottom: 12px;
    background: #1e213a;
}

.card-img-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.play-fab {
    position: absolute;
    right: 8px;
    bottom: 8px;
    width: 44px;
    height: 44px;
    background: #a855f7;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 16px rgba(168, 85, 247, 0.4);
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.3s ease;
    border: none;
    cursor: pointer;
    color: #fff;
    font-size: 16px;
}
.card:hover .play-fab { opacity: 1; transform: translateY(0); }
.play-fab:hover { transform: scale(1.05); background: #9333ea; }

.card-title {
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 4px;
}

.card-subtitle {
    font-size: 12px;
    color: #94a3b8;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* PLAYER BAR */
.player {
    grid-area: player;
    background: #05060a;
    border-top: 1px solid #1e213a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 100;
}

.player-left {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 30%;
}

.player-thumb {
    width: 56px;
    height: 56px;
    border-radius: 4px;
    background: #1e213a;
    object-fit: cover;
}

.player-meta .title { font-size: 14px; font-weight: 600; color: #fff; cursor: pointer; }
.player-meta .title:hover { text-decoration: underline; }
.player-meta .artist { font-size: 11px; color: #94a3b8; cursor: pointer; }
.player-meta .artist:hover { text-decoration: underline; }

.player-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 40%;
    max-width: 600px;
}

.player-controls-btns {
    display: flex;
    align-items: center;
    gap: 20px;
}

.player-btn {
    background: none;
    border: none;
    color: #94a3b8;
    cursor: pointer;
    font-size: 16px;
    transition: color 0.2s;
}
.player-btn:hover { color: #fff; }
.player-btn.active-opt { color: #a855f7; }

.main-play-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #fff;
    color: #000;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.1s;
    font-size: 14px;
}
.main-play-btn:hover { transform: scale(1.06); }

.playback-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    font-size: 11px;
    color: #94a3b8;
}

.progress-slider {
    flex: 1;
    height: 4px;
    background: #2a2d4a;
    border-radius: 2px;
    cursor: pointer;
    position: relative;
}
.progress-fill {
    width: 0%;
    height: 100%;
    background: #fff;
    border-radius: 2px;
    position: relative;
}
.progress-slider:hover .progress-fill { background: #a855f7; }

.player-right {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    width: 30%;
}

.volume-slider {
    width: 90px;
    height: 4px;
    background: #2a2d4a;
    border-radius: 2px;
    cursor: pointer;
    position: relative;
}
.volume-fill {
    width: 100%;
    height: 100%;
    background: #fff;
    border-radius: 2px;
}

/* LYRICS MODAL */
.modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(10px);
    z-index: 999;
    display: none;
    align-items: center;
    justify-content: center;
}
.lyrics-box {
    background: #131525;
    border: 1px solid #2a2d4a;
    width: 600px;
    max-height: 80vh;
    border-radius: 12px;
    padding: 30px;
    text-align: center;
    overflow-y: auto;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
}
.lyrics-box h2 { margin-bottom: 20px; color: #a855f7; }
.lyrics-content { font-size: 18px; line-height: 2.2; color: #94a3b8; }

/* GİZLİ YOUTUBE OYNATICI CONTAINER */
#youtube-player-container { position: absolute; top: -9999px; left: -9999px; }
</style>
</head>
<body>

<!-- GİRİŞ FORMU -->
<div class="auth-overlay" id="authOverlay">
    <div class="auth-box">
        <h1>🌌 SoundVerse</h1>
        <p>Kozmik müzik evrenine adım atmak için bilgilerinizi girin.</p>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="fullNameInput">Ad Soyad</label>
                <input type="text" id="fullNameInput" class="auth-input" placeholder="Örn: Ahmet Yılmaz" required>
            </div>
            <div class="form-group">
                <label for="ageInput">Yaş</label>
                <input type="number" id="ageInput" class="auth-input" placeholder="Örn: 24" min="10" max="100" required>
            </div>
            <div class="form-group">
                <label for="emailInput">E-posta Adresi</label>
                <input type="email" id="emailInput" class="auth-input" placeholder="ahmet@example.com" required>
            </div>
            <button type="submit" class="auth-btn">Kozmik Yolculuğa Başla</button>
        </form>
    </div>
</div>

<aside class="sidebar">
    <div class="logo">🚀 SoundVerse</div>
    <div class="menu-group">
        <a class="menu-item active" onclick="switchView('home', this)">🏠 Ana Sayfa</a>
        <a class="menu-item" onclick="switchView('search', this)">🔍 Ara</a>
        <a class="menu-item" onclick="switchView('library', this)">📚 Kitaplık</a>
    </div>
    <div class="playlist-divider"></div>
    <div class="menu-item" onclick="createNewPlaylist()">➕ Çalma Listesi Oluştur</div>
    <div class="playlist-list" id="playlistContainer"></div>
</aside>

<main class="main" id="mainContent">
    <div class="topbar">
        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="Hangi uzay frekansını arıyorsun?" oninput="handleSearch(this.value)">
        </div>
        <div class="user-profile" id="userAvatarBadge">SV</div>
    </div>

    <div id="dynamicView">
        <h2 class="section-title">Galaktik Öne Çıkanlar</h2>
        <div class="grid" id="songGrid"></div>
    </div>
</main>

<div class="player">
    <div class="player-left">
        <img id="playerThumb" class="player-thumb" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=100" alt="">
        <div class="player-meta">
            <div class="title" id="playerTitle">Şarkı Seçilmedi</div>
            <div class="artist" id="playerArtist">SoundVerse</div>
        </div>
        <button class="player-btn" onclick="toggleFavoriteCurrent()" id="currentFavBtn">♡</button>
    </div>

    <div class="player-center">
        <div class="player-controls-btns">
            <button class="player-btn" onclick="toggleShuffle()" id="shuffleBtn">🔀</button>
            <button class="player-btn" onclick="previousSong()">⏮</button>
            <button class="main-play-btn" id="mainPlayBtn" onclick="togglePlay()">▶</button>
            <button class="player-btn" onclick="nextSong()">⏭</button>
            <button class="player-btn" onclick="toggleRepeat()" id="repeatBtn">🔁</button>
        </div>
        <div class="playback-bar">
            <span id="currentTime">0:00</span>
            <div class="progress-slider" id="progressSlider" onclick="seekAudio(event)">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span id="duration">0:00</span>
        </div>
    </div>

    <div class="player-right">
        <button class="player-btn" onclick="openLyrics()">🎤</button>
        <button class="player-btn">🔊</button>
        <div class="volume-slider" id="volumeSlider" onclick="changeVolume(event)">
            <div class="volume-fill" id="volumeFill" style="width: 100%;"></div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="lyricsModal" onclick="closeLyrics(event)">
    <div class="lyrics-box" onclick="event.stopPropagation()">
        <h2 id="lyricsTitle">Şarkı Sözleri</h2>
        <div class="lyrics-content" id="lyricsText">Bu parça için henüz söz eklenmedi.</div>
    </div>
</div>

<!-- Gizli YouTube Çatısı (Gerçek Ses Çalımı İçin) -->
<div id="youtube-player-container"><div id="yt-player"></div></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const songs = [
    { id: 0, title: "Sen Kal Ölene Kadar", artist: "Tuna Velibaşoğlu", youtubeId: "Pj8p59no2Fw", lyrics: "Sanki bir rüya gibi...\nBirlikte geçen yıllar..." },
    { id: 1, title: "Die With A Smile", artist: "Lady Gaga & Bruno Mars", youtubeId: "kPa7bsKwL-c", lyrics: "If the world was ending...\nI'd wanna be next to you..." },
    { id: 2, title: "Ah Ben Öleyim Yollarına", artist: "Zaaf", youtubeId: "OpEGLdlWV6c", lyrics: "Yollar uzun, geceler karanlık..." },
    { id: 3, title: "Olmuşum Leyla", artist: "Buray", youtubeId: "lIyqo5iv7Ac", lyrics: "Mecnun gibi çöllerdeyim..." },
    { id: 4, title: "Seni Yazdım", artist: "Müslüm Gürses", youtubeId: "wtOHNhG0EZc", lyrics: "Kalbime yazdım seni, silinmez..." },
    { id: 5, title: "Acı Bal", artist: "Dedublüman & Sıla", youtubeId: "XTdU5RSodZ4", lyrics: "Dudaklarımda acı bir tat..." },
    { id: 6, title: "YIN YANG", artist: "Motive", youtubeId: "lDpXhLzJQsA", lyrics: "Gece ve gündüz gibi..." },
    { id: 7, title: "Sarılırım Birine", artist: "Adamlar", youtubeId: "RVFVUopU88c", lyrics: "Yalnızlık başa bela..." },
    { id: 8, title: "Madem", artist: "Dolu Kadehi Ters Tut", youtubeId: "06ofoaE5nUY", lyrics: "Madem gidiyorsun..." },
    { id: 9, title: "Bana Ne Bu Sevdalardan (Live)", artist: "Ezhel", youtubeId: "HaJSYCFsgOY", lyrics: "Bana da bu sevdalardan bir yer verin...\nYeni bir bana ne bu sevdalardan..." },
    { id: 10, title: "Kum Gibi", artist: "Ahmet Kaya", youtubeId: "1miwaIZwJbk", lyrics: "Martılar ağlardı çöplüklerde...\nBiz seninle gülüşürdük..." },
    { id: 11, title: "Sevgi Duvarı", artist: "Ahmet Kaya", youtubeId: "Qjs1FZj1ofk", lyrics: "Başka balığın yerile gedir...\nDe görün neylemişem..." },
    { id: 12, title: "Training Season (Live)", artist: "Dua Lipa", youtubeId: "3DcoC8p9az8", lyrics: "Are you someone that I can give my heart to?\nOr just the poison that I'm drawn to..." }
];

songs.forEach(s => s.cover = `https://img.youtube.com/vi/${s.youtubeId}/hqdefault.jpg`);

let currentSongId = -1;
let isPlaying = false;
let isShuffle = false;
let isRepeat = false;
let favorites = [];
let customPlaylists = [
    { name: "Kozmik Favoriler", songs: [] },
    { name: "Türkçe Pop Hitleri", songs: [0, 3, 5, 9] },
    { name: "Galaktik Akustik", songs: [1, 7, 8, 10, 11] },
    { name: "Yıldızlararası Canlı", songs: [9, 12] }
];

let ytPlayer = null;
let isPlayerReady = false;
let updateTimer = null;

function handleLogin(e) {
    e.preventDefault();
    const fullName = document.getElementById("fullNameInput").value.trim();
    const age = document.getElementById("ageInput").value.trim();
    const email = document.getElementById("emailInput").value.trim();

    if (fullName && age && email) {
        const initials = fullName.split(" ").map(n => n[0]).join("").toUpperCase().substring(0, 2);
        document.getElementById("userAvatarBadge").textContent = initials || "SV";
        document.getElementById("authOverlay").style.display = "none";
    }
}

function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player('yt-player', {
        height: '100', width: '100',
        playerVars: { autoplay: 0, controls: 0, origin: window.location.origin || '*' },
        events: {
            'onReady': () => { isPlayerReady = true; },
            'onStateChange': onPlayerStateChange
        }
    });
}

function onPlayerStateChange(e) {
    const mainPlayBtn = document.getElementById("mainPlayBtn");
    if (e.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        mainPlayBtn.innerHTML = "⏸";
        startTimer();
    } else if (e.data === YT.PlayerState.PAUSED) {
        isPlaying = false;
        mainPlayBtn.innerHTML = "▶";
        stopTimer();
    } else if (e.data === YT.PlayerState.ENDED) {
        if (isRepeat) {
            playSong(currentSongId);
        } else {
            nextSong();
        }
    }
}

function renderPlaylistsSidebar() {
    const container = document.getElementById("playlistContainer");
    container.innerHTML = "";
    customPlaylists.forEach((pl, idx) => {
        const div = document.createElement("div");
        div.className = "playlist-item";
        div.textContent = `🪐 ${pl.name}`;
        div.onclick = () => showPlaylistDetail(idx);
        container.appendChild(div);
    });
}

function renderSongGrid(listToRender = songs, title = "Galaktik Öne Çıkanlar") {
    const container = document.getElementById("dynamicView");
    container.innerHTML = `<h2 class="section-title">${title}</h2><div class="grid" id="songGrid"></div>`;
    const targetGrid = document.getElementById("songGrid");

    listToRender.forEach(song => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
            <div class="card-img-container">
                <img src="${song.cover}" alt="">
                <button class="play-fab" onclick="event.stopPropagation(); playSong(${song.id})">▶</button>
            </div>
            <div class="card-title">${song.title}</div>
            <div class="card-subtitle">${song.artist}</div>
        `;
        card.onclick = () => playSong(song.id);
        targetGrid.appendChild(card);
    });
}

function playSong(id) {
    currentSongId = id;
    const song = songs.find(s => s.id === id);
    if (!song) return;

    document.getElementById("playerTitle").textContent = song.title;
    document.getElementById("playerArtist").textContent = song.artist;
    document.getElementById("playerThumb").src = song.cover;
    updateFavButtonUI();

    if (isPlayerReady && ytPlayer && ytPlayer.loadVideoById) {
        ytPlayer.loadVideoById(song.youtubeId);
    } else {
        setTimeout(() => playSong(id), 300);
    }
}

function togglePlay() {
    if (currentSongId === -1) {
        playSong(0);
        return;
    }
    if (ytPlayer && ytPlayer.getPlayerState) {
        if (ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) {
            ytPlayer.pauseVideo();
        } else {
            ytPlayer.playVideo();
        }
    }
}

function nextSong() {
    if (songs.length === 0) return;
    if (isShuffle) {
        let randId = Math.floor(Math.random() * songs.length);
        playSong(randId);
    } else {
        let nextId = (currentSongId + 1) % songs.length;
        playSong(nextId);
    }
}

function previousSong() {
    if (songs.length === 0) return;
    let prevId = (currentSongId - 1 + songs.length) % songs.length;
    playSong(prevId);
}

function toggleShuffle() {
    isShuffle = !isShuffle;
    document.getElementById("shuffleBtn").classList.toggle("active-opt", isShuffle);
}

function toggleRepeat() {
    isRepeat = !isRepeat;
    document.getElementById("repeatBtn").classList.toggle("active-opt", isRepeat);
}

function toggleFavoriteCurrent() {
    if (currentSongId === -1) return;
    if (favorites.includes(currentSongId)) {
        favorites = favorites.filter(id => id !== currentSongId);
    } else {
        favorites.push(currentSongId);
    }
    updateFavButtonUI();
}

function updateFavButtonUI() {
    const btn = document.getElementById("currentFavBtn");
    if (favorites.includes(currentSongId)) {
        btn.textContent = "♥";
        btn.style.color = "#a855f7";
    } else {
        btn.textContent = "♡";
        btn.style.color = "#94a3b8";
    }
}

function startTimer() {
    stopTimer();
    updateTimer = setInterval(() => {
        if (ytPlayer && ytPlayer.getCurrentTime) {
            const curr = ytPlayer.getCurrentTime();
            const dur = ytPlayer.getDuration();
            if (dur > 0) {
                document.getElementById("progressFill").style.width = (curr / dur * 100) + "%";
                document.getElementById("currentTime").textContent = formatTime(curr);
                document.getElementById("duration").textContent = formatTime(dur);
            }
        }
    }, 250);
}

function stopTimer() {
    if (updateTimer) clearInterval(updateTimer);
}

function seekAudio(e) {
    const slider = document.getElementById("progressSlider");
    const rect = slider.getBoundingClientRect();
    const percent = (e.clientX - rect.left) / rect.width;
    if (ytPlayer && ytPlayer.getDuration) {
        ytPlayer.seekTo(percent * ytPlayer.getDuration(), true);
    }
}

function changeVolume(e) {
    const slider = document.getElementById("volumeSlider");
    const rect = slider.getBoundingClientRect();
    const percent = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    document.getElementById("volumeFill").style.width = (percent * 100) + "%";
    if (ytPlayer && ytPlayer.setVolume) {
        ytPlayer.setVolume(percent * 100);
    }
}

function formatTime(sec) {
    if (!sec || isNaN(sec)) return "0:00";
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
}

function handleSearch(query) {
    query = query.toLowerCase().trim();
    if (!query) {
        renderSongGrid(songs);
        return;
    }
    const filtered = songs.filter(s => s.title.toLowerCase().includes(query) || s.artist.toLowerCase().includes(query));
    renderSongGrid(filtered, `Arama Sonuçları: "${query}"`);
}

function switchView(view, el) {
    document.querySelectorAll(".menu-item").forEach(i => i.classList.remove("active"));
    if(el) el.classList.add("active");

    if (view === 'home') {
        renderSongGrid(songs, "Galaktik Öne Çıkanlar");
    } else if (view === 'library') {
        const favSongs = songs.filter(s => favorites.includes(s.id));
        renderSongGrid(favSongs, "Favori Kozmik Parçaların");
    } else if (view === 'search') {
        document.getElementById("searchInput").focus();
    }
}

function showPlaylistDetail(index) {
    const pl = customPlaylists[index];
    const plSongs = songs.filter(s => pl.songs.includes(s.id));
    renderSongGrid(plSongs, pl.name);
}

function createNewPlaylist() {
    let name = prompt("Yeni kozmik çalma listesinin adı:");
    if (name) {
        customPlaylists.push({ name: name, songs: [0, 9] });
        renderPlaylistsSidebar();
    }
}

function openLyrics() {
    if (currentSongId === -1) return;
    const song = songs.find(s => s.id === currentSongId);
    document.getElementById("lyricsTitle").textContent = song.title;
    document.getElementById("lyricsText").innerText = song.lyrics || "Bu parça için söz bulunamadı.";
    document.getElementById("lyricsModal").style.display = "flex";
}

function closeLyrics(e) {
    document.getElementById("lyricsModal").style.display = "none";
}

renderPlaylistsSidebar();
renderSongGrid(songs);
</script>
</body>
</html>
